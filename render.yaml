services:
  - type: web
    name: bravo-website
    runtime: node
    plan: starter
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Avoids in-process Sharp resizing on `/_next/image` (major RAM saver on small plans).
      # Remove if you upgrade instance memory and want on-the-fly optimization again.
      - key: NEXT_DISABLE_IMAGE_OPTIMIZATION
        value: "1"
